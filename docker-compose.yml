
services:
  postgres:
    image: postgres:17
    container_name: quota-postgres

    environment:
      POSTGRES_USER: quota_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: quota_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota_app -d quota_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required}

    command: >
      sh -c "npm run db:migrate:app && npm run db:seed"

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  api:
    build:
      context: .

    env_file:
      - .env

    environment:
      PORT: "3000"
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required}
      NODE_ENV: production

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - api

    restart: unless-stopped

volumes:
  postgres_data:
